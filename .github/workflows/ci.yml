name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened]
  page_build: 
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Nivel de detalle de la ejecución'
        required: false
        default: 'info'
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [run-tests]

jobs:
  selfhosted:
    runs-on: self-hosted
    steps:
      - name: Hola
        run: 'echo "Hola mundo desde self-hoste runner"'
  test:
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Instalar dependencias
        run: npm install
      - name: Ejecutar pruebas y guardar evidencia
        shell: bash
        run: |
          set -o pipefail
          npm test | tee test-results.txt
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: test-results.txt
      
      - name: Mostrar parámetros
        run: 'echo "Nivel seleccionado: ${{ inputs.logLevel }}"'

      - name: Echo the payload
        run: |
          echo "Event type: ${{ github.event.action }}"
          echo "Payload value: ${{ github.event.client_payload.env }}"

