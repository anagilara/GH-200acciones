name: Publish Package to GitHub Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-package:
    name: Build and Publish NPM Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm install

      - name: Validate package scope for GitHub Packages
        run: |
          node -e "const fs=require('fs'); const owner=(process.env.GITHUB_REPOSITORY_OWNER || '').toLowerCase(); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const expected='@'+owner+'/'; if(!pkg.name || !pkg.name.toLowerCase().startsWith(expected)){ console.error('Invalid package name for GitHub Packages. Expected scope: '+expected+'* ; current name: '+pkg.name); process.exit(1);}"

      - name: Build package
        run: npm run build --if-present

      - name: Run package tests
        run: npm test --if-present

      - name: Generate package tarball
        run: npm pack

      - name: Publish package to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
