name: CI-CD

on:
  push:
    branches: [main]
    paths: 'src/'
  pull_request:
    branches: [main]
    types: [opened]
  schedule:
    - cron: '0 5 * * SUN'
  page_build: 
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Nivel de detalle de la ejecución'
        required: false
        default: 'info'
env:
  AZURE_WEBAPP_NAME: gh200webapp3928
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  
jobs:
  selfhosted:
    if: github.ref == 'refs/heads/developer'
    runs-on: self-hosted
    steps:
      - name: Hola
        run: 'echo "Hola mundo desde self-hoste runner"'
  ci:
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Instalar dependencias
        run: npm install
      - name: Ejecutar pruebas y guardar evidencia
        shell: bash
        run: |
          set -o pipefail
          npm test | tee test-results.txt
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: test-results.txt
      
      - name: Mostrar parámetros
        run: 'echo "Nivel seleccionado: ${{ inputs.logLevel }}"'
      
      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: Ver contenido de la caché
        run: |
          ls -la ~/.npm

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          
  cd:
    runs-on: ubuntu-latest
    needs: ci
    name: Deploy app container to Azure
    environment:
      name: Staging
      
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          
      - name: "Login via Azure CLI"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: 'Deploy to Azure WebApp'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      - name: Azure logout
        run: |
          az logout

